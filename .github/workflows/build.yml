name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev

      - name: Build Tools
        run: |
          # 1. Build standard tools
          make tools
          
          # 2. Ensure your manual agbcc is executable
          # This assumes your structure is tools/agbcc/build.sh
          chmod -R +x tools/agbcc
          
          # 3. Build agbcc manually if needed
          cd tools/agbcc && ./build.sh && ./install.sh && cd ../..

      - name: Build ROM
        run: |
          # Set the path so the Makefile finds the newly installed agbcc
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-ROM
          path: "*.gba"