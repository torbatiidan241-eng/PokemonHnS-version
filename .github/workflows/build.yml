name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev autoconf

      - name: Build Tools
        run: |
          # 1. Build standard tools
          make tools
          
          # 2. Specifically build agbcc
          # Some projects require building agbcc this way
          cd tools/agbcc
          ./build.sh
          ./install.sh
          cd ../..
          
          # 3. Final verification
          if [ ! -f "tools/agbcc/bin/agbcc" ]; then
            echo "AGBCC failed to build!"
            ls -R tools/agbcc
            exit 1
          fi

      - name: Build ROM
        run: |
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-ROM-Build
          path: "*.gba"
