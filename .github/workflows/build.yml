name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev autoconf

      - name: Build Compiler
        run: |
          # 1. Instead of building from source, ensure we have the necessary 32-bit libraries
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libncurses5:i386 libstdc++6:i386
          
          # 2. Build the tools that CAN be built
          make tools

      - name: Build ROM
        run: |
          # Use the provided AGUCC_PATH to bypass pathing issues
          make -j$(nproc)
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-ROM
          path: "*.gba"
