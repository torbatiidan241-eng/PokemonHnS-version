name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # This is the crucial line

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev autoconf

      - name: Build Tools
        run: |
          # Build standard tools first
          make tools
          
          # Since you are using a submodule, these tools should now 
          # be available at tools/agbcc
          # We don't need to manually 'cd' or run build.sh if make tools handles it
          
      - name: Build ROM
        run: |
          # Build the ROM
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-ROM
          path: "*.gba"
