name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev autoconf

      - name: Build Tools
        run: |
          # Manually build the tools first to ensure they exist
          make tools
          # Verify that agbcc actually exists before moving on
          ls -l tools/agbcc/bin/agbcc || (echo "AGBCC not found!" && exit 1)

      - name: Build ROM
        run: |
          # Build the game now that tools are confirmed
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-ROM-Build
          path: "*.gba"
