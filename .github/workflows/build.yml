name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev libgmp-dev gcc-arm-none-eabi

      - name: Initialize and Verify Submodules
        run: |
          git submodule update --init --recursive
          if [ ! -d "tools/agbcc" ] || [ -z "$(ls -A tools/agbcc)" ]; then
            echo "Error: tools/agbcc submodule is empty!"
            exit 1
          fi

      - name: Build Tools
        run: |
          make tools
          
          if [ ! -f "tools/agbcc/bin/agbcc" ]; then
            echo "Binary missing, attempting manual build..."
            cd tools/agbcc
            
            # 1. Compile
            ./build.sh
            
            # 2. Create the exact path the installer expects
            mkdir -p ../../tools/agbcc
            
            # 3. Run install.sh pointing to the project root
            # Note: We use the absolute path to the project root
            ./install.sh "$(pwd)/../../"
            
            cd ../..
          fi
          
          # Final validation
          if [ -f "tools/agbcc/bin/agbcc" ]; then
            echo "Compiler successfully found at tools/agbcc/bin/agbcc"
          else
            # DEBUG: Print the directory structure to see where files went
            echo "Listing tools/agbcc directory:"
            ls -R tools/agbcc
            exit 1
          fi
      - name: Build ROM
        run: |
          # The standard build command
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-ROM
          path: "*.gba"
