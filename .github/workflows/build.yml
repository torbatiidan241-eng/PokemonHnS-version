name: Build PokemonHnS-version

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install modern devkitARM
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpng-dev
        # Download and run the official devkitPro install script
        wget https://apt.devkitpro.org/install-devkitpro-pacman
        chmod +x install-devkitpro-pacman
        sudo ./install-devkitpro-pacman --noconfirm
        # Use the newly installed pacman to get GBA development tools
        sudo dkp-pacman -Syy --noconfirm
        sudo dkp-pacman -S gba-dev --noconfirm

    - name: Set Environment Variables
      run: |
        echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
        echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
        echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH

    - name: Compile ROM
      run: |
        make -j$(nproc) nonmatching

    - name: Upload GBA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PokemonHnS-version-Build
        path: "*.gba"
