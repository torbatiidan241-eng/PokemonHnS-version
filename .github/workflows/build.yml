name: Build ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Fetch and install agbcc
        run: |
          mkdir -p tools/agbcc
          # This URL fetches a reliable, pre-compiled binary package
          curl -L https://github.com/pret/agbcc/releases/download/build-tools/agbcc.tar.gz | tar -xz -C tools/agbcc
          chmod +x tools/agbcc/bin/agbcc
      - name: Build tools
        run: make tools

      - name: Build ROM
        run: make

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-rom
          path: |
            *.gba
