name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev libgmp-dev gcc-arm-none-eabi

      - name: Initialize and Verify Submodules
        run: |
          git submodule update --init --recursive
          if [ ! -d "tools/agbcc" ] || [ -z "$(ls -A tools/agbcc)" ]; then
            echo "Error: tools/agbcc submodule is empty!"
            exit 1
          fi

      - name: Build Tools
        run: |
          make tools
          
          # If the binary is missing, force the manual build with the correct path
          if [ ! -f "tools/agbcc/bin/agbcc" ]; then
            echo "Binary missing, attempting manual build with path..."
            cd tools/agbcc
            ./build.sh
            # Tell the script to install into the local 'bin' folder
            ./install.sh "$(pwd)/bin"
            cd ../..
          fi
          
          # Final validation
          if [ ! -f "tools/agbcc/bin/agbcc" ]; then
            echo "CRITICAL: agbcc still not found after manual install."
            exit 1
          fi
      - name: Build ROM
        run: |
          # The standard build command
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-ROM
          path: "*.gba"
