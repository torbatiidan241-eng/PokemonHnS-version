name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev autoconf

      - name: Build and Verify Compiler
        run: |
          cd tools/agbcc
          ./build.sh
          ./install.sh
          # CRITICAL: Verify the file exists
          if [ -f "bin/agbcc" ]; then
            echo "Compiler found at $(pwd)/bin/agbcc"
          else
            echo "Compiler failed to install!"
            exit 1
          fi
          cd ../..

      - name: Build ROM
        run: |
          # Use the path to the verified binary
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-ROM
          path: "*.gba"
