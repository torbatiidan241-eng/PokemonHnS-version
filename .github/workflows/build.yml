name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev

      - name: Build ROM
        run: |
          # 1. Clean the build directory
          make clean
          # 2. Rebuild the essential GBA toolchain
          make tools
          # 3. Finally, compile the game using the now-present tools
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-ROM-Build
          path: "*.gba"
