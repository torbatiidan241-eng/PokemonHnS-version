name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev autoconf

      - name: Build Compiler
        run: |
          # 1. Compile agbcc
          cd tools/agbcc
          ./build.sh
          # 2. Force install into the expected location
          mkdir -p bin
          cp agbcc bin/agbcc
          cd ../..

      - name: Build ROM
        run: |
          # 3. Explicitly tell make where the compiler is
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-ROM
          path: "*.gba"
