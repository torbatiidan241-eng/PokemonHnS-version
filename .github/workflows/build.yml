name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev autoconf

      - name: Build Compiler (agbcc)
        run: |
          # The agbcc folder is a submodule; we must build it to create the 'bin/agbcc' file
          cd tools/agbcc
          ./build.sh
          ./install.sh
          cd ../..

      - name: Build ROM
        run: |
          # Now that agbcc is built, the standard make process will work
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-ROM
          path: "*.gba"
