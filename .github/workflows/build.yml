name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev

      - name: Build Tools
        run: |
          # 1. Build the local tools (gbagfx, mid2agb, etc)
          make tools
          
          # 2. Check if agbcc exists
          if [ ! -f "tools/agbcc/bin/agbcc" ]; then
            echo "AGBCC binary missing! Attempting to build from source..."
            cd tools/agbcc
            ./build.sh
            ./install.sh
            cd ../..
          fi

      - name: Build ROM
        run: |
          # The -j$(nproc) flag parallelizes the build
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-ROM
          path: "*.gba"
