name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev autoconf

      - name: Build Tools
        run: |
          # 1. Install necessary dependencies for tool compilation
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev libgmp-dev gcc-arm-none-eabi
          
          # 2. Build the tools. 
          # Note: If your project is a standard pret fork, 'make tools' 
          # will handle downloading the correct agbcc binary for you.
          make tools
          
          # 3. Check if it worked
          if [ -f "tools/agbcc/bin/agbcc" ]; then
            echo "Compiler successfully set up."
          else
            echo "ERROR: tools/agbcc/bin/agbcc not found after 'make tools'."
            # Final fallback: If this fails, the submodule may not be linked correctly.
            exit 1
          fi

      - name: Build ROM
        run: |
          # Use the project-standard build command
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-ROM
          path: "*.gba"
