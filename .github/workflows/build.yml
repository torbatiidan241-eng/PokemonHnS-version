name: Build GBA ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libgmp-dev autoconf

      - name: Build and Verify Compiler
        run: |
          # 1. Skip the broken manual build
          # 2. Download the pre-compiled agbcc for Linux
          # Many projects use a specific URL for their toolchain
          # Or, if your repository has the 'tools' folder, verify the binary exists.
          
          echo "Attempting to find/download pre-compiled agbcc..."
          # This assumes you are following the standard 'pret' setup.
          # If you don't have the binary, you can download a known-good one:
          wget https://github.com/pret/agbcc/releases/download/latest/agbcc.tar.gz
          tar -xvf agbcc.tar.gz -C tools/agbcc/
          
          # 3. Verify it exists
          if [ -f "tools/agbcc/bin/agbcc" ]; then
            chmod +x tools/agbcc/bin/agbcc
            echo "Compiler found and executable at $(pwd)/tools/agbcc/bin/agbcc"
          else
            echo "Failed to download/extract compiler!"
            exit 1
          fi
      - name: Build ROM
        run: |
          # Use the path to the verified binary
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-ROM
          path: "*.gba"
