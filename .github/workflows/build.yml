name: Build ROM

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Get agbcc
        run: |
          # Download the compiler directly from the official source
          curl -L https://github.com/pret/agbcc/releases/download/latest/agbcc.tar.gz | tar -xz -C tools/
          # Fix permissions for the binary
          chmod +x tools/agbcc/bin/agbcc
      - name: Build ROM
        run: make

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-rom
          path: |
            *.gba
